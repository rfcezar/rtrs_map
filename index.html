<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PoliSoy Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }
    .leaflet-popup-content ul { padding-left: 18px; margin: 0; }

    #search-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    #city-search {
      width: 220px;
      padding: 5px;
      font-size: 14px;
    }

    #study-link, #contact-info {
      margin-top: 8px;
      font-size: 13px;
    }

    #study-link a, #contact-info a {
      text-decoration: none;
      color: #0077cc;
    }

    #study-link a:hover, #contact-info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="search-container">
    <input type="text" id="city-search" placeholder="Type a city name" list="city-list" />
    <datalist id="city-list"></datalist>

    <div id="study-link">
      <a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5262465" target="_blank">
        Checkout our study using PoliSoy
      </a>
    </div>

    <div id="contact-info">
      Contact: <a href="mailto:rodrigo.cezar@fgv.br">rodrigo.cezar@fgv.br</a>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-15, -55], 4);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap & CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const datalist = document.getElementById('city-list');
    const searchInput = document.getElementById('city-search');
    let activeLayer = null;

    function getColor(value) {
      return value > 1000000 ? '#08306b' :
             value > 500000  ? '#2171b5' :
             value > 100000  ? '#6baed6' :
             value > 0       ? '#c6dbef' : 'white';
    }

    function parseTopParties(raw) {
      try {
        return typeof raw === "string" ? JSON.parse(raw) : (Array.isArray(raw) ? raw : []);
      } catch (_) {
        return [];
      }
    }

    function createPopup(props, prefix) {
      const parties = parseTopParties(props[`${prefix}_TopParties`]);
      const list = parties.length > 0
        ? parties.map(p => `<li>${p.name}: R$${Number(p.value).toLocaleString()} (${p.percent}%)</li>`).join('')
        : "<li>No parties listed</li>";

      const total = props[`${prefix}_TotalDonated`];
      const formattedTotal = (typeof total === "number" && !isNaN(total))
        ? `R$${total.toLocaleString()}`
        : "R$0";

      return `
        <b>${props.name_muni}</b><br>
        Total donated: ${formattedTotal}<br>
        <u>Top parties:</u><ul>${list}</ul>
      `;
    }

    fetch('muni_map.geojson')
      .then(res => res.json())
      .then(data => {
        const cities = new Set();
        const layerAll = L.layerGroup();
        const layerRTRS = L.layerGroup();

        data.features.forEach(f => {
          const props = f.properties;
          const name = props.name_muni?.trim();
          const allVal = props.All_TotalDonated || 0;
          const rtrsVal = props.RTRS_TotalDonated || 0;

          const layer1 = L.geoJSON(f, {
            style: {
              color: 'gray',
              weight: 0.5,
              fillColor: getColor(allVal),
              fillOpacity: 0.7
            },
            onEachFeature: (feature, layer) => {
              layer._cityName = name?.toLowerCase();
              layer.bindPopup(createPopup(props, 'All'));
            }
          });

          const layer2 = L.geoJSON(f, {
            style: {
              color: 'gray',
              weight: 0.5,
              fillColor: getColor(rtrsVal),
              fillOpacity: 0.7
            },
            onEachFeature: (feature, layer) => {
              layer._cityName = name?.toLowerCase();
              layer.bindPopup(createPopup(props, 'RTRS'));
            }
          });

          layerAll.addLayer(layer1);
          layerRTRS.addLayer(layer2);

          if (name && !cities.has(name)) {
            const option = document.createElement("option");
            option.value = name;
            datalist.appendChild(option);
            cities.add(name);
          }
        });

        const baseMaps = {
          "All shareholders": layerAll,
          "RTRS audited": layerRTRS
        };

        L.control.layers(baseMaps, null, { collapsed: false }).addTo(map);
        layerAll.addTo(map);
        activeLayer = layerAll;

        map.on('baselayerchange', function(e) {
          activeLayer = e.layer;
        });
      });

    searchInput.addEventListener('change', function () {
      const input = this.value.trim().toLowerCase();
      if (!input || !activeLayer) return;

      activeLayer.eachLayer(layer => {
        if (layer._cityName === input) {
          map.fitBounds(layer.getBounds());
          layer.openPopup();
        }
      });
    });
  </script>
</body>
</html>
